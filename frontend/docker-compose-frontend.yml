version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-mom-frontend
    restart: unless-stopped
    ports:
      - "3015:3015"
    environment:
      - NODE_ENV=production
      - PORT=3015
    # Uncomment next lines if you want to load environment variables from .env.local file
    # env_file:
    #   - .env.local
