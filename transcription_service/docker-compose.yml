version: '3.8'

services:
  # 🔵 Mock Transcription Engine (No GPU Required)
  mock-transcription-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mom-mock-transcription
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Tells the mock service how to find the backend container for its callback
      - BACKEND_API_URL=http://13.232.78.99:3014